<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vecinal — Manzana 08</title>
    <!-- Importamos Tailwind CSS para que se vea moderno y estilizado de forma simple -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 antialiased">

    <!-- Encabezado / Navbar -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg">⚠️ ALERTA VECINAL</h1>
            <span class="bg-green-500 text-xs px-2 py-1 rounded-full animate-pulse font-semibold">Red Activa</span>
        </div>
    </header>

    <!-- Contenedor Principal (Estilo Móvil) -->
    <main class="max-w-md mx-auto p-4 space-y-6 pb-24">
        
        <!-- Estado de la Manzana -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-center">
            <span class="text-sm text-gray-500 font-medium">Barrio Las Acacias • Manzana 08</span>
            <h2 class="text-xl font-bold mt-1 text-gray-800">Tu manzana está protegida</h2>
            <p class="text-xs text-gray-500 mt-2 px-4">Ante una emergencia, activá una alerta. Los vecinos conectados reciben tu ubicación de inmediato.</p>
            
            <!-- Estadísticas rápidas -->
            <div class="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-gray-100 text-center">
                <div>
                    <span class="block text-lg font-bold text-blue-600">27</span>
                    <span class="text-[10px] text-gray-400 uppercase font-semibold">Activos</span>
                </div>
                <div>
                    <span class="block text-lg font-bold text-blue-600">2 min</span>
                    <span class="text-[10px] text-gray-400 uppercase font-semibold">Resp. Prom</span>
                </div>
                <div>
                    <span class="block text-lg font-bold text-blue-600">30</span>
                    <span class="text-[10px] text-gray-400 uppercase font-semibold">Miembros</span>
                </div>
            </div>
        </section>

        <!-- BOTÓN DE ALERTA PRINCIPAL -->
        <section class="text-center">
            <button onclick="activarAlerta('General')" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full font-black text-2xl shadow-xl shadow-red-200 transition-transform active:scale-95 border-8 border-red-100 uppercase tracking-wider mx-auto block flex flex-col justify-center items-center">
                <span>¡ALERTA!</span>
                <span class="text-[10px] font-normal normal-case tracking-normal opacity-80 mt-1">Tocar para activar</span>
            </button>
        </section>

        <!-- SECCIÓN: ¿Qué está ocurriendo? -->
        <section class="space-y-3">
            <h3 class="font-bold text-gray-700 text-sm px-1">¿QUÉ ESTÁ OCURRIENDO?</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="activarAlerta('Robo')" class="p-3 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 active:scale-95 transition-all">
                    <span class="text-xl">🚨</span>
                    <h4 class="font-bold text-sm mt-1">Robo / Intruso</h4>
                    <p class="text-[11px] text-gray-400 leading-tight">En curso o sospechoso</p>
                </button>
                <button onclick="activarAlerta('Incendio')" class="p-3 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 active:scale-95 transition-all">
                    <span class="text-xl">🔥</span>
                    <h4 class="font-bold text-sm mt-1">Incendio</h4>
                    <p class="text-[11px] text-gray-400 leading-tight">Fuego o fuga de gas</p>
                </button>
                <button onclick="activarAlerta('Médica')" class="p-3 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 active:scale-95 transition-all">
                    <span class="text-xl">🚑</span>
                    <h4 class="font-bold text-sm mt-1">Emergencia</h4>
                    <p class="text-[11px] text-gray-400 leading-tight">Asistencia médica / vial</p>
                </button>
                <button onclick="activarAlerta('Sospechoso')" class="p-3 bg-white border border-gray-200 rounded-xl text-left hover:bg-gray-50 active:scale-95 transition-all">
                    <span class="text-xl">👀</span>
                    <h4 class="font-bold text-sm mt-1">Sospechoso</h4>
                    <p class="text-[11px] text-gray-400 leading-tight">Auto o persona extraña</p>
                </button>
            </div>
        </section>

    </main>

    <!-- Menú Inferior de Navegación Fijo -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around text-center text-gray-500">
            <a href="#" class="text-blue-600 flex flex-col items-center">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-medium">Inicio</span>
            </a>
            <a href="#" class="hover:text-blue-600 flex flex-col items-center">
                <span class="text-xl">🔔</span>
                <span class="text-[10px] font-medium">Alertas</span>
            </a>
            <a href="#" class="hover:text-blue-600 flex flex-col items-center">
                <span class="text-xl">👥</span>
                <span class="text-[10px] font-medium">Vecinos</span>
            </a>
        </div>
    </nav>

    <!-- Lógica de botones (JavaScript) -->
    <script>
        function activarAlerta(tipo) {
            alert('🚨 ALERTA ENVIADA: Se ha reportado una emergencia de tipo "' + tipo + '" en la Manzana 08. Los vecinos están siendo notificados.');
            // Aquí en el futuro puedes conectar un sistema de notificaciones real o WhatsApp masivo
        }
    </script>
</body>
</html>
